[project]
name = "fin-assistant"
version = "0.1.0"
description = "Финпомощник — AI-ассистент для анализа личных доходов и расходов (дипломный проект курса «ИИ-разработчик: от API до агентов»)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "jinja2>=3.1",
    "jsonschema>=4.22",
    "httpx>=0.27",
    "structlog>=26.1.0",
    "fastapi>=0.143.0",
    "uvicorn[standard]>=0.54.0",
    "redis>=8.1.0",
    "arize-phoenix-otel>=0.17.2",
    "openinference-instrumentation-openai>=0.1.65",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.32.0",
    "alembic>=1.20.0",
    "aiofiles>=25.1.0",
    "tiktoken>=0.14.0",
    "aiogram>=3.31.0",
    "pypdf>=6.20.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "tenacity>=9.2.1",
    "diskcache>=5.6.3",
    "numpy>=2.5.4",
    "qdrant-client>=1.19.1",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "pymupdf>=1.28.2",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.16.0",
    "testcontainers[postgres]>=4.15.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["llm: тесты, которые ходят в настоящий LLM API (нужен ключ)", "integration: нужны запущенные сервисы (Qdrant)"]

[tool.uv]
package = false
