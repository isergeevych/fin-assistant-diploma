# Б4.4 — самый дешёвый слой модерации: регулярные выражения по категориям.
# Ловит грубые случаи до LLM; тонкие — опциональный слой OpenAI Moderation.
# Шаблоны — Python regex, регистр не учитывается. Держим их узкими: ложный отказ
# тоже вредит пользователю.
categories:
  fraud:
    # Финансовый домен: просьбы помочь с мошенническими схемами
    - "\\bобнал\\w*"
    - "\\bдроп(ы|ов|ам|а)?\\b.*\\b(карт|счёт|счет)"
    - "\\bкардинг\\w*"
    - "(украсть|увести|снять)\\s+(деньги|средства)\\s+(с|со)\\s+(чужой|чужого|чужих)"
    - "как\\s+(обмануть|развести)\\s+(банк|пенсионер|человека)"
    - "\\bcash\\s*out\\b.*\\bcards?\\b"
  harassment:
    - "\\b(ублюд\\w*|мраз\\w*|урод\\w*|дебил\\w*|идиот\\w*)\\b"
    - "\\b(fuck(ing)?\\s+you|stupid\\s+bitch)\\b"
  hate:
    - "\\b(ненавижу|уничтожить)\\s+(всех\\s+)?(людей|человечество)\\b"
    - "\\bi\\s+hate\\s+humans\\b"
  violence:
    - "\\b(убить|зарезать|взорвать)\\s+(его|её|ее|их|человека|людей)\\b"
    - "\\bкак\\s+сделать\\s+(бомбу|взрывчатку)\\b"
