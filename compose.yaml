# Весь стек одной командой:
#   cp .env.example .env   # заполнить ключи
#   docker compose up -d --build
#
# APP_PORT — порт на хосте (по умолчанию 8000; на машине разработчика 8000 занят
# другим проектом, поэтому там APP_PORT=8010 в .env).

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: llm-service:v1
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file: .env
    environment:
      # redis — DNS-имя сервиса в compose-сети, не localhost
      REDIS_URL: redis://redis:6379/0
      # Локальная модель (tertiary fallback) живёт на хосте, а не в контейнере
      LLM__LOCAL_BASE_URL: ${LLM_LOCAL_BASE_URL_DOCKER:-http://host.docker.internal:11434/v1}
      # Б3.6: трейсы OpenInference → Phoenix (phoenix.otel сам добавит /v1/traces)
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006
      # Б4.1: внутри compose-сети Postgres — это хост postgres:5432
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      QDRANT_URL: http://qdrant:6333
      # Эмбеддинги — Ollama на хосте
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL_DOCKER:-http://host.docker.internal:11434/v1}
      # LLM для RAG: пусто → основной LLM (OpenRouter); для локальной модели на хосте задать в .env
      RAG_LLM_BASE_URL: ${RAG_LLM_BASE_URL_DOCKER:-}
      # Re-ranker требует torch (+~700 МБ) — в образ сервиса не кладём (лимит 3.5: < 500 МБ).
      # В контейнере score-guard работает по векторному порогу; локально (uv sync --extra rerank) — по re-ranker.
      RAG_RERANK_ENABLED: "false"
      # Б5.6: дерево query → retrieve → LLM в Phoenix (extra `tracing` есть в образе)
      PHOENIX_LLAMAINDEX_TRACING: ${PHOENIX_LLAMAINDEX_TRACING:-true}
    volumes:
      - ./data:/app/data        # корпус + загрузки через POST /documents/upload
      - app-var:/app/var        # docstore (хеши для UPSERTS), кеш эмбеддингов
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      phoenix:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
      ingest:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # Б4.2–4.3: Telegram-бот — тот же образ, другая команда. Порт 9000 (/notify) НЕ пробрасывается
  # на хост: до него доходит только app по внутренней сети.
  bot:
    image: llm-service:v1
    command: ["python", "-m", "bot"]
    env_file: .env
    environment:
      BACKEND_URL: http://app:8000
    depends_on:
      app:
        condition: service_healthy
    restart: on-failure   # без BOT_TOKEN бот завершается с кодом 0 и не перезапускается

  # Б5.5: одноразовая индексация базы знаний (IngestionPipeline + UPSERTS). На повторном запуске
  # docstore видит «0 changed» и сервис завершается за секунды.
  ingest:
    image: llm-service:v1
    command: ["python", "-m", "app.services.ingestion", "/app/data"]
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL_DOCKER:-http://host.docker.internal:11434/v1}
    volumes:
      - ./data:/app/data
      - app-var:/app/var
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      qdrant:
        condition: service_healthy
    restart: "no"

  # Одноразовый сервис: применяет миграции и завершается. app стартует только после
  # его успешного выхода — приложение никогда не увидит БД без нужных таблиц.
  migrate:
    image: llm-service:v1
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Только localhost и не 5432 (на машине разработчика занят другим проектом) — для psql/alembic с хоста
      - "127.0.0.1:5433:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Б5.2: векторная БД. unprivileged-сборка — процесс не под root.
  qdrant:
    image: qdrant/qdrant:v1.19.2-unprivileged
    ports:
      - "127.0.0.1:6333:6333"   # REST + dashboard (только localhost)
      - "127.0.0.1:6334:6334"   # gRPC
    environment:
      # Ключ обязателен даже на dev: конфиг уезжает в прод, а «забытый» открытый Qdrant — утечка данных
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    volumes:
      - qdrant_storage:/qdrant/storage   # без тома после docker compose down -v всё пропадёт
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    # Без ports: Redis доступен только app по внутренней сети, на хост не торчит
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  phoenix:
    # Версия закреплена (не :latest) — обновления UI/схемы хранилища не должны приезжать молча
    image: arizephoenix/phoenix:version-20.21
    ports:
      # Только на localhost: в трейсах полные промпты и ответы
      - "127.0.0.1:6006:6006"   # UI + OTLP/HTTP
      - "127.0.0.1:4317:4317"   # OTLP/gRPC
    environment:
      PHOENIX_WORKING_DIR: /data
    volumes:
      - phoenix-data:/data
    restart: unless-stopped

volumes:
  redis_data: {}
  phoenix-data: {}
  pg-data: {}
  qdrant_storage: {}
  app-var: {}
